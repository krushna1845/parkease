services:
  # ─────────────────────────────────────────────────
  # MongoDB database with persistent named volume
  # ─────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: parkease-mongo
    restart: unless-stopped
    # Do NOT expose port 27017 publicly — only accessible within the compose network
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    # Lock MongoDB to the internal network only
    networks:
      - parkease-net

  # ─────────────────────────────────────────────────
  # Node.js + Express backend API
  # ─────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: parkease-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Use the compose service name "mongo" — NOT localhost
      MONGO_URI: mongodb://mongo:27017/parkease
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:80}
      # Razorpay (optional — set in .env for real payments)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Email (optional — console fallback if unset)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - parkease-net

  # ─────────────────────────────────────────────────
  # Nginx-served React frontend (multi-stage build)
  # The nginx.conf proxies /api/ to the server service
  # so the browser always talks to the same host/port.
  # ─────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # /api is a relative URL — browser resolves against the page origin.
        # This means the frontend works at any public hostname without rebuilding.
        VITE_API_URL: /api
    container_name: parkease-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - parkease-net

# ─────────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────────
volumes:
  # Named volume — data survives container restarts & rebuilds
  mongo_data:
    driver: local

networks:
  parkease-net:
    driver: bridge
